{% extends 'index.html' %} {% load static %} {% block content %}
<section class="wrapper py-4">
  <div class="flex flex-col items-center">
    <img
      src="{% static '/images/decoration.png' %}"
      alt=""
      width="170"
      class="object-contain"
    />
    <h1 class="font-display text-xl sm:text-3xl">Explore Our Delicious Menu</h1>
    <div class="hr-curve mt-1"></div>
  </div>
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10 mb-10 place-items-center">
    {% for category in categories %}
    <a href="{% url 'food-items' category.slug %}" class="card w-80 bg-base-100 shadow-lg h-full">
      <figure class="px-7 pt-7">
        <div class="h-44 w-full">
          <img
            src="{% if category.image %}{{ category.image.url }}{% else %}{% static 'images/no-image.jpg' %}{% endif %}"
            alt=""
            class="object-cover w-full h-full rounded-xl"
            width="100%"
            height="100%"
          />
        </div>
      </figure>
      <div class="card-body items-center text-center py-5">
        <h2 class="font-display text-2xl">{{ category.name }}</h2>
        <p class="text-sm mt-[-5px]">{{ category.description }}</p>
      </div>
    </a>
    {% endfor %}
  </div>
</section>
{% endblock %}
